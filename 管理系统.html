<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网安24-1班级管理系统</title>
    <style>
        /* --- 全局样式重置 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh; /* 占满全屏高度 */
            background-color: #f0f2f5;
        }

        /* --- 1. 顶部栏样式 --- */
        .header {
            height: 60px;
            background-color: #001529; /* 深蓝色背景 */
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .header span {
            margin-left: 10px;
        }

        /* --- 主体容器（包含左侧和右侧） --- */
        .main-container {
            display: flex;
            flex: 1; /* 占据剩余高度 */
            overflow: hidden; /* 防止出现双滚动条 */
        }

        /* --- 2. 左侧侧边栏样式 --- */
        .sidebar {
            width: 220px;
            background-color: #ffffff;
            border-right: 1px solid #e8e8e8;
            display: flex;
            flex-direction: column;
            padding-top: 10px;
        }

        .menu-btn {
            padding: 15px 25px;
            cursor: pointer;
            transition: all 0.3s;
            color: #333;
            font-size: 15px;
            border-left: 4px solid transparent; /* 左侧选中条预留 */
        }

        .menu-btn:hover {
            color: #1890ff;
            background-color: #e6f7ff;
        }

        /* 激活状态的按钮样式 */
        .menu-btn.active {
            color: #1890ff;
            background-color: #e6f7ff;
            border-left-color: #1890ff;
            font-weight: 500;
        }

        /* --- 3. 右侧内容区域样式 --- */
        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto; /* 内容过多时滚动 */
        }

        /* 默认隐藏所有内容卡片 */
        .tab-content {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            min-height: 500px; /* 最小高度 */
            animation: fadeIn 0.3s ease-in-out;
        }

        /* 只有带有 active 类的内容才显示 */
        .tab-content.active {
            display: block;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 顶部栏 -->
    <div class="header">
        🛡️ 网安24-1班级管理系统
    </div>

    <!-- 主体部分 -->
    <div class="main-container">
        
        <!-- 左侧菜单 -->
        <div class="sidebar">
            <!-- 这里的 onclick 参数对应下方内容的 ID -->
            <div class="menu-btn active" onclick="switchTab('home', this)">🏠 班级概况</div>
            <div class="menu-btn" onclick="switchTab('students', this)">👨‍🎓 学生名单</div>
            <div class="menu-btn" onclick="switchTab('grades', this)">📊 成绩管理</div>
            <div class="menu-btn" onclick="switchTab('lottery', this)">🎲 抽签工具</div>
            <div class="menu-btn" onclick="switchTab('settings', this)">⚙️ 系统设置</div>
        </div>

        <!-- 右侧内容区 -->
        <div class="content-area">

            <!-- ========================================== -->
            <!-- 模块 1：班级概况 (默认显示) -->
            <!-- ========================================== -->
            <div id="home" class="tab-content active">
                <h2>班级概况</h2>
                <p>这里是班级的数据概览。</p >
                
                <!-- 👇【在此处添加“班级概况”的具体内容代码】 👇 -->
                <div style="display: flex; gap: 20px; margin-top: 20px;">
                    <div style="background:#e6f7ff; padding: 20px; border-radius: 8px; flex: 1;">
                        <h3>总人数</h3>
                        <p style="font-size: 24px; color: #1890ff; margin-top: 10px;">45 人</p >
                    </div>
                    <div style="background:#f6ffed; padding: 20px; border-radius: 8px; flex: 1;">
                        <h3>出勤率</h3>
                        <p style="font-size: 24px; color: #52c41a; margin-top: 10px;">98%</p >
                    </div>
                </div>
                <!-- 👆【内容添加结束】 👆 -->
            </div>

            <!-- ========================================== -->
            <!-- 模块 2：学生名单 -->
            <!-- ========================================== -->
            <div id="students" class="tab-content">
                <h2>学生名单管理</h2>
                
                <!-- 👇【在此处添加“学生名单”的具体内容代码】 👇 -->
                <p>你可以在这里放之前的表格代码。</p >
                <!-- 👆【内容添加结束】 👆 -->
            </div>

            <!-- ========================================== -->
            <!-- 模块 3：成绩管理 -->
            <!-- ========================================== -->
            <div id="grades" class="tab-content">
                <h2>成绩录入与分析</h2>
                
                <!-- 👇【在此处添加“成绩管理”的具体内容代码】 👇 -->
                <p>这里可以放成绩单或者图表。</p >
                <!-- 👆【内容添加结束】 👆 -->
            </div>

            <!-- ========================================== -->
            <!-- 模块 4：抽签工具 -->
            <!-- ========================================== -->
            <div id="lottery" class="tab-content">
                <h2>幸运大转盘</h2>
                
                <!-- 👇【在此处添加“抽签工具”的具体内容代码】 👇 -->
                <p>这里可以放刚才做的转盘 HTML 代码。</p >
                <!-- 👆【内容添加结束】 👆 -->
            </div>

             <!-- ========================================== -->
            <!-- 模块 5：系统设置 -->
            <!-- ========================================== -->
            <div id="settings" class="tab-content">
                <h2>系统设置</h2>
                
                <!-- 👇【在此处添加“系统设置”的具体内容代码】 👇 -->
                <p>这里放修改密码、导出数据等功能。</p >
                <!-- 👆【内容添加结束】 👆 -->
            </div>

        </div>
    </div>

    <script>
        /**
         * 切换标签页功能的函数
         * @param {string} tabId - 要显示的内容区域的 ID (例如 'home')
         * @param {element} btnElement - 被点击的按钮元素本身
         */
        function switchTab(tabId, btnElement) {
            // 1. 隐藏所有内容区域
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => {
                content.classList.remove('active');
            });

            // 2. 移除所有按钮的激活状态 (变回灰色)
            const buttons = document.querySelectorAll('.menu-btn');
            buttons.forEach(btn => {
                btn.classList.remove('active');
            });

            // 3. 显示目标内容区域
            document.getElementById(tabId).classList.add('active');

            // 4. 给当前点击的按钮添加激活状态 (变蓝)
            btnElement.classList.add('active');
        }
    </script>
</body>
</html>
