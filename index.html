    <style>
        /* --- 全局样式重置 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh; /* 占满全屏高度 */
            background-color: #f0f2f5;
        }

        /* --- 1. 顶部栏样式 --- */
        .header {
            height: 60px;
            background-color: #001529; /* 深蓝色背景 */
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .header span {
            margin-left: 10px;
        }

        /* --- 主体容器（包含左侧和右侧） --- */
        .main-container {
            display: flex;
            flex: 1; /* 占据剩余高度 */
            overflow: hidden; /* 防止出现双滚动条 */
        }

        /* --- 2. 左侧侧边栏样式 --- */
        .sidebar {
            width: 220px;
            background-color: #ffffff;
            border-right: 1px solid #e8e8e8;
            display: flex;
            flex-direction: column;
            padding-top: 10px;
        }

        .menu-btn {
            padding: 15px 25px;
            cursor: pointer;
            transition: all 0.3s;
            color: #333;
            font-size: 15px;
            border-left: 4px solid transparent; /* 左侧选中条预留 */
        }

        .menu-btn:hover {
            color: #1890ff;
            background-color: #e6f7ff;
        }

        /* 激活状态的按钮样式 */
        .menu-btn.active {
            color: #1890ff;
            background-color: #e6f7ff;
            border-left-color: #1890ff;
            font-weight: 500;
        }

        /* --- 3. 右侧内容区域样式 --- */
        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto; /* 内容过多时滚动 */
        }

        /* 默认隐藏所有内容卡片 */
        .tab-content {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            min-height: 500px; /* 最小高度 */
            animation: fadeIn 0.3s ease-in-out;
        }

        /* 只有带有 active 类的内容才显示 */
        .tab-content.active {
            display: block;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

         * @param {string} tabId - 要显示的内容区域的 ID (例如 'home')
         * @param {element} btnElement - 被点击的按钮元素本身
         */
        function switchTab(tabId, btnElement) {
            // 1. 隐藏所有内容区域
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => {
                content.classList.remove('active');
            });

            // 2. 移除所有按钮的激活状态 (变回灰色)
            const buttons = document.querySelectorAll('.menu-btn');
            buttons.forEach(btn => {
                btn.classList.remove('active');
            });

            // 3. 显示目标内容区域
            document.getElementById(tabId).classList.add('active');

            // 4. 给当前点击的按钮添加激活状态 (变蓝)
            btnElement.classList.add('active');
        }

    // ==========================================
    // 渲染表格函数 (把数据变成网页上的表格)
    // ==========================================
    function renderTable(data) {
        const tableBody = document.getElementById("studentTableBody");
        tableBody.innerHTML = ""; // 清空表格原有内容

        data.forEach(student => {
            const row = `
                <tr>
                    <td style="padding: 10px; border-bottom: 1px solid #eee;">${student.sno}</td>
                    <td style="padding: 10px; border-bottom: 1px solid #eee; font-weight: bold;">${student.name}</td>
                    <td style="padding: 10px; border-bottom: 1px solid #eee;">${student.gender}</td>
                    <td style="padding: 10px; border-bottom: 1px solid #eee;">${student.grade}</td>
                    <td style="padding: 10px; border-bottom: 1px solid #eee;">${student.cls}</td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }

    // ==========================================
    // 搜索过滤功能
    // ==========================================
    function filterTable() {
        const input = document.getElementById("searchInput");
        const filter = input.value.toUpperCase();
        
        // 筛选数据
        const filteredData = studentsData.filter(student => 
            student.name.includes(filter) || student.sno.includes(filter)
        );
        
        // 重新渲染表格
        renderTable(filteredData);
    }

    // 页面加载完成后，立即渲染一次完整表格
    // 使用 setTimeout 确保 HTML 元素已经加载完毕
    setTimeout(() => {
        if(document.getElementById("studentTableBody")) {
            renderTable(studentsData);
        }
    }, 100);
